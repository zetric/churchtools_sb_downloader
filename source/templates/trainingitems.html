<div class="border-bottom row" style="margin-bottom: 16px; padding-bottom: 8px">
  <div class="col-9">
    <h4
        style="color: rgb(120,120,120); margin-bottom: 4px;">
        {{training['title']}}
    </h4>
    {% if 'description' in training %}
    <div><b>Description:</b> {{training['description']}}</div>
    {% endif %}
  </div>
  <div class="col-3">
    <a href="/training/{{training.id}}" class="btn btn-outline-primary">Apply</a>
  </div>
</div>
