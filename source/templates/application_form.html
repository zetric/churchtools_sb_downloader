<h4>Application Form</h4>
<form action="/training/{{training['id']}}/apply" method="post">
  <div class="mb-2">
    <label>Full Name</label><br>
    <input type="text" name="full_name" placeholder="Bruce Wayne">
  </div>

  <div class="mb-2">
    <label>Email</label><br>
    <input type="text" name="email" placeholder="bruce@wayne.com">
  </div> 

  <div class="mb-2">
    <label>LinkedIn URL</label><br>
    <input type="text" name="linkedin_url" placeholder="https://linkedin.com/bruce_wayne">
  </div>

  <div class="mb-2">
    <label>Education</label><br>
    <textarea name="education"></textarea>
  </div>

  <div class="mb-2">
    <label>Training Experience</label><br>
    <textarea name="training_experience"></textarea>
  </div>

  <input type="submit" name="">
</form>
